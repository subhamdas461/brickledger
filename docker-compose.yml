# Production-style stack: PostgreSQL + BrickLedger (API serving the web app).
#   JWT_SECRET=$(openssl rand -base64 48) POSTGRES_PASSWORD=... APP_URL=https://app.example.com docker compose up -d
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: brickledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: brickledger
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brickledger"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://brickledger:${POSTGRES_PASSWORD}@db:5432/brickledger
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (32+ random characters)}
      APP_URL: ${APP_URL:-http://localhost:4000}
      CORS_ORIGINS: ${APP_URL:-http://localhost:4000}
      BILLING_PROVIDER: ${BILLING_PROVIDER:-mock}
      PRICING_CURRENCY: ${PRICING_CURRENCY:-INR}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-BrickLedger <no-reply@brickledger.app>}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PRO_MONTH: ${STRIPE_PRICE_PRO_MONTH:-}
      STRIPE_PRICE_PRO_YEAR: ${STRIPE_PRICE_PRO_YEAR:-}
      STRIPE_PRICE_BUSINESS_MONTH: ${STRIPE_PRICE_BUSINESS_MONTH:-}
      STRIPE_PRICE_BUSINESS_YEAR: ${STRIPE_PRICE_BUSINESS_YEAR:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      RAZORPAY_PLAN_PRO_MONTH: ${RAZORPAY_PLAN_PRO_MONTH:-}
      RAZORPAY_PLAN_PRO_YEAR: ${RAZORPAY_PLAN_PRO_YEAR:-}
      RAZORPAY_PLAN_BUSINESS_MONTH: ${RAZORPAY_PLAN_BUSINESS_MONTH:-}
      RAZORPAY_PLAN_BUSINESS_YEAR: ${RAZORPAY_PLAN_BUSINESS_YEAR:-}
    ports:
      - "4000:4000"
    volumes:
      - uploads:/app/apps/api/uploads

volumes:
  pgdata:
  uploads:
