org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Address of your live BrickLedger site for release builds, e.g. https://your-project.vercel.app
# (website and API share it). Debug/staging builds use -Pbrickledger.apiUrl instead.
brickledger.productionUrl=https://brickledger-amber.vercel.app

# App version. `npm run release:android` raises both on every release.
brickledger.versionCode=4
brickledger.versionName=1.0.3
